services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-global_mining_network}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"

  api:
    build:
      context: ./server
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-global_mining_network}
      REDIS_URL: redis://redis:6379/0
      MESSAGE_QUEUE_URL: ${MESSAGE_QUEUE_URL:-redis://redis:6379/0}
      ADMIN_TOTP_SECRET: ${ADMIN_TOTP_SECRET:-}
      MAINTENANCE_AUTH_HEADER: ${MAINTENANCE_AUTH_HEADER:-X-Maintenance-Token}
      MAINTENANCE_AUTH_TOKEN: ${MAINTENANCE_AUTH_TOKEN:-local-maintenance-token}
      MAINTENANCE_AUTH_PREVIOUS_TOKEN: ${MAINTENANCE_AUTH_PREVIOUS_TOKEN:-}
      MAINTENANCE_AUTH_CURRENT_TOKEN_SCOPE_LABEL: ${MAINTENANCE_AUTH_CURRENT_TOKEN_SCOPE_LABEL:-current}
      MAINTENANCE_AUTH_PREVIOUS_TOKEN_SCOPE_LABEL: ${MAINTENANCE_AUTH_PREVIOUS_TOKEN_SCOPE_LABEL:-previous}
      MAINTENANCE_AUTH_UNKNOWN_TOKEN_SCOPE_LABEL: ${MAINTENANCE_AUTH_UNKNOWN_TOKEN_SCOPE_LABEL:-unknown}
      MAINTENANCE_CLEANUP_RATE_LIMIT_WINDOW_SECONDS: ${MAINTENANCE_CLEANUP_RATE_LIMIT_WINDOW_SECONDS:-60}
      MAINTENANCE_CLEANUP_RATE_LIMIT_MAX_REQUESTS: ${MAINTENANCE_CLEANUP_RATE_LIMIT_MAX_REQUESTS:-6}
      MAINTENANCE_CLEANUP_RATE_LIMIT_PERSISTENCE_ENABLED: ${MAINTENANCE_CLEANUP_RATE_LIMIT_PERSISTENCE_ENABLED:-true}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./content:/content:ro
    depends_on:
      - db
      - redis

  worker:
    build:
      context: ./workers
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-global_mining_network}
      REDIS_URL: redis://redis:6379/0
      MESSAGE_QUEUE_URL: ${MESSAGE_QUEUE_URL:-redis://redis:6379/0}
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      MAINTENANCE_AUTH_HEADER: ${MAINTENANCE_AUTH_HEADER:-X-Maintenance-Token}
      MAINTENANCE_AUTH_TOKEN: ${MAINTENANCE_AUTH_TOKEN:-local-maintenance-token}
      MAINTENANCE_AUTH_PREVIOUS_TOKEN: ${MAINTENANCE_AUTH_PREVIOUS_TOKEN:-}
      MAINTENANCE_AUTH_TOKEN_FILE: ${MAINTENANCE_AUTH_TOKEN_FILE:-}
      BLOCKCHAIN_CLEANUP_ENABLED: ${BLOCKCHAIN_CLEANUP_ENABLED:-true}
      BLOCKCHAIN_CLEANUP_INTERVAL_SECONDS: ${BLOCKCHAIN_CLEANUP_INTERVAL_SECONDS:-300}
      BLOCKCHAIN_CLEANUP_STARTUP_JITTER_SECONDS: ${BLOCKCHAIN_CLEANUP_STARTUP_JITTER_SECONDS:-0}
      BLOCKCHAIN_CLEANUP_BACKOFF_MAX_SECONDS: ${BLOCKCHAIN_CLEANUP_BACKOFF_MAX_SECONDS:-1800}
      BLOCKCHAIN_CLEANUP_TIMEOUT_SECONDS: ${BLOCKCHAIN_CLEANUP_TIMEOUT_SECONDS:-10}
      BLOCKCHAIN_EVENT_RETENTION_SECONDS: ${BLOCKCHAIN_EVENT_RETENTION_SECONDS:-86400}
      BLOCKCHAIN_CHECKPOINT_RETENTION_SECONDS: ${BLOCKCHAIN_CHECKPOINT_RETENTION_SECONDS:-604800}
      BLOCKCHAIN_MAX_NETWORK_EVENTS: ${BLOCKCHAIN_MAX_NETWORK_EVENTS:-100000}
    depends_on:
      - db
      - redis

volumes:
  postgres_data: